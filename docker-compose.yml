services:
  darukaa-api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - APP_ENV=development
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - SQLITE_DB_PATH=/app/data/darukaa_biodiversity.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

  darukaa-ui:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - BACKEND_API_URL=http://darukaa-api:8000
    depends_on:
      - darukaa-api
