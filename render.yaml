services:
  - type: web
    name: darukaa-biodiversity-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/ingest_documents.py && python scripts/seed_database.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        value: https://darukaa-biodiversity-ai.vercel.app
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000,http://localhost:5173"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
